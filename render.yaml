# Render Blueprint — AeroSync Production Deployment
services:
  # 1. Express Backend
  - type: web
    name: aerosync-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: npm install && node prisma-setup.js
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aerosync-db
          property: connectionString
      - key: CLIENT_URL
        fromService:
          type: web
          name: aerosync-frontend
          property: host
      - key: JWT_SECRET
        generateValue: true

  # 2. AI Service
  - type: web
    name: aerosync-ai
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: aerosync-backend
          property: host

  # 3. Static Frontend
  - type: web
    name: aerosync-frontend
    runtime: static
    plan: free
    region: oregon
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: aerosync-backend
          property: host
      - key: VITE_WS_URL
        fromService:
          type: web
          name: aerosync-backend
          property: host
      - key: VITE_AI_URL
        fromService:
          type: web
          name: aerosync-ai
          property: host

databases:
  - name: aerosync-db
    plan: free
    postgresVersion: 15
